<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">Inventory System</p>
      </div>
    </div>
    <div class="live" id="liveStatus">
      <span class="live-dot"></span>
      <span id="liveText">جارٍ الاتصال...</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>المخزون الحي</h1>
    </section>

    <section class="metrics" aria-label="إحصائيات">
      <div class="metric">
        <p class="metric-label">إجمالي القراءات</p>
        <p class="metric-value" id="totalReads">0</p>
      </div>
      <div class="metric">
        <p class="metric-label">تاقات فريدة</p>
        <p class="metric-value" id="uniqueTags">0</p>
      </div>
      <div class="metric">
        <p class="metric-label">آخر قوة إشارة</p>
        <p class="metric-value mono rssi-green" id="lastRssi">—</p>
      </div>
    </section>

    <section class="latest" aria-label="آخر قراءة">
      <p class="section-label">آخر تاق وصل</p>
      <p class="latest-epc mono" id="latestEpc">بانتظار أول قراءة...</p>
      <p class="latest-meta" id="latestMeta"></p>
    </section>

    <section class="feed" aria-label="التاقات المسماة">
      <div class="feed-head">
        <h2>التاقات والأسماء</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>EPC</th>
              <th>القوة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="tagsBody">
            <tr class="empty-row">
              <td colspan="4">لا توجد تاقات بعد</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="feed" aria-label="سجل القراءات">
      <div class="feed-head">
        <h2>سجل القراءات</h2>
        <div class="feed-actions">
          <button type="button" class="ghost-btn" id="refreshBtn">تحديث يدوي</button>
          <button type="button" class="danger-btn" id="clearAllBtn">حذف كل القراءات</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>EPC</th>
              <th>القوة</th>
              <th>الوقت</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="readsBody">
            <tr class="empty-row">
              <td colspan="5">لا توجد قراءات بعد</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="nameDialog" class="dialog">
    <form method="dialog" id="nameForm">
      <h3>تسمية التاق</h3>
      <p class="dialog-epc mono" id="dialogEpc"></p>
      <label for="nameInput">الاسم (مثال: عطر شعر)</label>
      <input id="nameInput" type="text" maxlength="80" placeholder="عطر عود / جهاز / ..." required />
      <div class="dialog-actions">
        <button type="submit" class="primary-btn" value="save">حفظ</button>
        <button type="button" class="ghost-btn" id="cancelNameBtn">إلغاء</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
